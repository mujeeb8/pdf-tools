<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Images to PDF Converter Online Free | iOpenPDF</title>
  <meta name="description" content="Convert JPG and PNG images to a PDF online for free. Combine images into a PDF privately in your browser.">
  <meta name="keywords" content="images to PDF, JPG to PDF, PNG to PDF, image to PDF converter, combine images into PDF, photos to PDF, images PDF maker">
  <meta name="author" content="iOpenPDF"><meta name="robots" content="index, follow, max-image-preview:large"><link rel="canonical" href="https://iopenpdf.com/images-to-pdf.html"><link rel="icon" type="image/png" href="./pdf-logo.png"><link rel="apple-touch-icon" href="./pdf-logo.png"><link rel="manifest" href="./site.webmanifest">
  <meta property="og:type" content="website"><meta property="og:site_name" content="iOpenPDF"><meta property="og:title" content="Images to PDF Converter Online Free | iOpenPDF"><meta property="og:description" content="Create a PDF from JPG and PNG images in your browser."><meta property="og:url" content="https://iopenpdf.com/images-to-pdf.html"><meta property="og:image" content="https://iopenpdf.com/pdf-logo.png"><meta name="twitter:card" content="summary">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Images to PDF Converter","url":"https://iopenpdf.com/images-to-pdf.html","applicationCategory":"UtilitiesApplication","operatingSystem":"Any","description":"Convert JPG and PNG images to PDF in the browser."}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
  <script type="module">
    import init from "./pdf-project.js";
    import { loadCachedWasm } from "./wasm-cache.js";
    await init({ module_or_path: await loadCachedWasm() });
  </script>
</head>
<body class="min-h-screen bg-[#fff8f8] text-red-950">
  <main class="mx-auto max-w-5xl px-6 py-8 sm:px-10 sm:py-12">
    <a href="index.html" class="mb-6 flex justify-center" aria-label="iOpenPDF home">
      <img src="./iopenpdf-logo.png" alt="iOpenPDF" class="h-auto w-full max-w-[20rem] sm:max-w-[26rem]">
    </a>
    <header class="mx-auto max-w-3xl text-center">
      <p class="text-xs font-bold uppercase tracking-[0.25em] text-red-600">02 / PDF utility</p>
      <h1 class="mt-3 text-5xl font-black tracking-tight">Images to PDF</h1>
      <p class="mx-auto mt-4 max-w-2xl leading-7 text-red-900/65">Arrange JPG and PNG images into a clean A4 PDF.</p>
    </header>
    <a href="index.html" class="text-sm font-bold text-red-600">&lt;- All PDF tools</a>
    <div class="mt-10 grid gap-8 lg:grid-cols-[0.8fr_1.2fr]">
      <section id="images-preview-drop-zone">
        <div id="images-drop-zone" class="mt-8 border-2 border-red-900 bg-white p-6 shadow-[7px_7px_0_#991b1b]">
          <label for="images-input" class="block text-sm font-bold">Select or drag and drop JPG and PNG files</label>
          <input id="images-input" type="file" accept="image/jpeg,image/png" multiple class="mt-3 block w-full text-sm file:mr-4 file:border-0 file:bg-red-600 file:px-4 file:py-2 file:font-bold file:text-white">
          <button id="images-pdf-btn" class="mt-5 w-full bg-red-600 px-5 py-3 font-bold text-white hover:bg-red-700">Create PDF</button>
          <button id="images-clear-btn" type="button" class="mt-3 w-full border-2 border-red-900 px-5 py-2 font-bold text-red-900 hover:bg-red-50">Clear selection</button>
          <p id="images-status" class="mt-4 text-sm text-red-900/65">Select at least one image.</p>
        </div>
      </section>
      <section>
        <div id="image-preview-empty" class="flex min-h-[32rem] items-center justify-center border-2 border-dashed border-red-900/25 bg-white/60 p-8 text-center text-red-900/45">Selected or dropped image previews will appear here.</div>
        <div id="image-preview" class="hidden min-h-[32rem] grid-cols-2 gap-3 border-2 border-red-900 bg-white p-4 sm:grid-cols-3"></div>
      </section>
    </div>
    <div hidden aria-hidden="true">
      <input id="pdf-input"><button id="compress-btn"></button><span id="status"></span>
      <input id="pdf-jpg-input"><button id="pdf-jpg-btn"></button><span id="pdf-jpg-status"></span>
      <input id="pdf-png-input"><button id="pdf-png-btn"></button><span id="pdf-png-status"></span>
      <input id="image-to-jpg-input"><button id="image-to-jpg-btn"></button><span id="image-to-jpg-status"></span>
      <input id="image-to-png-input"><button id="image-to-png-btn"></button><span id="image-to-png-status"></span>
      <input id="image-compress-input"><button id="image-compress-btn"></button><span id="image-compress-status"></span>
      <input id="image-compress-quality" value="72"><input id="image-compress-dimension" value="2400">
    </div>
  </main>
  <script type="module">import { setupImageDrop } from "./file-drop.js"; setupImageDrop("images-input", "images-drop-zone", "images-status", "image-preview", "image-preview-empty", "images-clear-btn", "images-preview-drop-zone");</script>
</body>
</html>
